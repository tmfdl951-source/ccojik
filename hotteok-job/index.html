<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>꼬직 · 호떡 알바</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="꼬직 · 호떡 알바" />
<meta property="og:description" content="90초 동안 호떡을 몇 개나 만들 수 있을까요." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- UI 는 최소한만. 조리는 전부 캔버스 안에서 직접 만진다.
     남은 시간과 완성 개수도 캔버스 위쪽 띠에 그린다. -->
<div class="app" id="app">
  <canvas id="cv"></canvas>

  <button class="mute" type="button" id="muteBtn" aria-pressed="false">소리</button>

  <!-- 개발용 상태 패널. 기본은 숨어 있다 — ?debug=1 로 켜거나 D 키로 여닫는다 -->
  <pre class="dbg" id="dbg" hidden></pre>

  <!-- 그림 받는 중 -->
  <div class="over over-load" id="loadOver">
    <p class="t-load">호떡 준비 중</p>
  </div>

  <!-- 시작 화면 — 무엇을 하는 게임인지 한 장면으로 보여 준다.
       말로 늘어놓는 대신 실제 플레이 화면을 먼저 보인다.
       여기를 지나기 전에는 시간이 가지 않는다. -->
  <div class="over over-start" id="startOver" hidden>
    <div class="s-body" id="sBody">
      <!-- 실제 게임에서 뽑은 장면: 철판 위 호떡, 전시대, 도구 -->
      <div class="s-shot">
        <img id="sShot" src="assets/opt/intro-shot.webp" width="1080" height="675"
             alt="철판에서 호떡을 굽는 게임 화면" />
      </div>
      <h1 class="t-title">호떡집을 운영하세요</h1>
      <p class="t-sub" id="sIntro">90초 동안 최대한 많이 파세요.<br />
        너무 세게 누르면 터집니다.</p>
      <button class="btn" type="button" id="startBtn" disabled>시작하기</button>
    </div>
  </div>

  <!-- 시간 종료 — 몇 개를 만들었나, 그리고 다시 도전 -->
  <div class="over over-end" id="endOver" hidden>
    <div class="e-body">
      <p class="e-title">시간 종료!</p>
      <p class="e-sub" id="eSub">90초 동안 만든 호떡</p>
      <p class="e-count" id="eCount">0개</p>
      <!-- 만든 호떡 = 판매한 호떡 + 남은 호떡 -->
      <dl class="e-stats">
        <div><dt>판매</dt><dd id="eSold">0개</dd></div>
        <div><dt>남은 호떡</dt><dd id="eLeft">0개</dd></div>
        <div><dt>만족 손님</dt><dd id="eHappy">0명</dd></div>
        <div><dt>불만 손님</dt><dd id="eUpset">0명</dd></div>
      </dl>
      <!-- 판매하고 남은 호떡들. 조리 화면의 전시대와 같은 목록이다. -->
      <canvas class="e-shelf" id="eShelf"></canvas>
      <button class="btn" type="button" id="againBtn">다시 도전</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script src="../analytics.js"></script>
</body>
</html>
