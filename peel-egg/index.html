<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>꼬직 · 흰자 안 뜯고 깔 수 있어요?</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="꼬직 · 흰자 안 뜯고 깔 수 있어요?" />
<meta property="og:description" content="20초 안에 껍질만 깨끗하게 까세요." />
<!-- 웹폰트: 제목·숫자(Pretendard) — 획이 뭉치지 않는 쪽으로 통일 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ===== 상단: 시간 · 껍질 · 흰자 ===== -->
  <div class="top">
    <div class="timer" id="timer">
      <span class="timer-num" id="timeNum">20.0</span>
      <div class="bar"><div class="bar-fill" id="timeFill"></div></div>
    </div>
    <div class="gauges">
      <span class="g">껍질 <b id="peelNum">0%</b></span>
      <span class="g">흰자 <b id="keepNum">100%</b></span>
    </div>
  </div>

  <!-- ===== 계란 ===== -->
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <!-- 시작 화면 -->
    <div class="over" id="startOver">
      <h1 class="title">흰자 안 뜯고<br>깔 수 있어요?</h1>
      <!-- 게임 방법 — 딱 세 줄. 화면 안내와 실제 판정이 같아야 한다. -->
      <ol class="how">
        <li><b>천천히</b> 문질러 금을 내세요</li>
        <li><b>금 간 부분</b>을 다시 문질러 벗기세요</li>
        <li><b>흰자</b>는 다시 문지르면 뜯겨요</li>
      </ol>
      <img class="hero" src="egg-shell.png" alt="삶은 계란" />
      <button class="btn big" type="button" id="startBtn">시작하기</button>
      <p class="best">최고 <span id="bestStart">0</span>점</p>
    </div>

    <!-- 결과 화면 -->
    <div class="over over-end" id="endOver" hidden>
      <p class="res-cap">결과</p>
      <div class="result-egg" id="resultEgg"></div>
      <p class="score-big" id="finalScore">0</p>
      <p class="grade" id="gradeLabel">제법 깔끔함</p>
      <p class="remark" id="remark"></p>
      <dl class="stats">
        <div><dt>껍질 제거율</dt><dd id="peelEnd">0%</dd></div>
        <div><dt>흰자 보존율</dt><dd id="keepEnd">0%</dd></div>
        <div><dt>남은 시간</dt><dd id="timeEnd">0.0초</dd></div>
      </dl>
      <div class="res-btns">
        <button class="btn big" type="button" id="againBtn">다시하기</button>
        <button class="btn ghost" type="button" id="shareBtn">결과 공유</button>
      </div>
      <p class="best">최고 <span id="bestEnd">0</span>점</p>
    </div>
  </div>

  <!-- ===== 하단: 진행률 ===== -->
  <div class="prog">
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <span class="prog-num" id="progNum">0%</span>
  </div>

  <div class="sig">ccojik</div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>window.SITE_ANALYTICS_PROJECT='ccojik-peel-egg';</script>
<script src="../analytics.js"></script>
</body>
</html>
