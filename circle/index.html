<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>완벽한 원 그리기</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="완벽한 원 그리기 챌린지" />
<meta property="og:description" content="한 붓에 동그라미! 몇 %까지 완벽하게 그릴 수 있나 ^^" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#0F1424; --panel:#171E33; --ink:#EAF0FF; --ink-soft:#8A97BD; --accent:#42E3C8; --accent-d:#28C6AC;
    --line:#2A3350; --good:#42E3C8; --mid:#F5C451; --bad:#F5677E; --shadow:0 14px 40px rgba(0,0,0,.4); }
  html, body { height: 100%; font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; color: var(--ink);
    -webkit-user-select: none; user-select: none;
    background: radial-gradient(circle at 30% 12%, #1b2b4e 0%, transparent 55%), radial-gradient(circle at 82% 90%, #16203c 0%, transparent 55%), var(--bg); }
  body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 10px; }
  .phone { position: relative; width: min(440px, 96vw); aspect-ratio: 9/16; max-height: 97dvh;
    background: var(--bg); border-radius: 30px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); }

  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }
  #startScreen { align-items: center; justify-content: safe center; text-align: center; padding: 26px 22px; }

  h1 { font-family: "Do Hyeon", sans-serif; font-size: 38px; line-height: 1.2; margin-top: 18px; }
  h1 .hl { color: var(--accent); }
  .desc { font-size: 14.5px; font-weight: 600; color: var(--ink-soft); margin-top: 14px; line-height: 1.6; }
  .ring-demo { width: 120px; height: 120px; margin: 20px auto 6px; border: 7px solid var(--accent); border-radius: 50%;
    border-right-color: transparent; animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { font-family: inherit; font-weight: 800; cursor: pointer; border: none; border-radius: 16px; transition: transform .12s ease; }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: linear-gradient(160deg, var(--accent), var(--accent-d)); color: #06231e; box-shadow: 0 6px 18px rgba(66,227,200,.3); }
  .btn.ghost { background: #1E2740; color: var(--accent); }
  .btn.soft { background: #1E2740; color: var(--ink); }
  .btn.big { font-size: 18px; padding: 16px 44px; margin-top: 24px; }
  .best-note { font-size: 13px; font-weight: 800; color: var(--accent); margin-top: 18px; }

  /* 게임 */
  #gameScreen { padding: 0; }
  .g-head { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
  .g-head .gh-title { font-family: "Do Hyeon", sans-serif; font-size: 18px; flex: 1; }
  .g-head .gh-best { font-size: 13px; font-weight: 800; color: var(--accent); }
  .g-head .gh-back { background: #1E2740; color: var(--ink-soft); border: none; font-family: inherit; font-weight: 800; font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer; }

  .canvas-wrap { flex: 1; position: relative; margin: 0 14px; border-radius: 20px; overflow: hidden;
    background: #0C1120; box-shadow: inset 0 0 0 1px var(--line); min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--ink-soft); font-size: 15px; font-weight: 700; pointer-events: none; line-height: 1.6; padding: 20px; }
  .hint.hide { display: none; }

  .result { flex-shrink: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); text-align: center; }
  .result.hide { display: none; }
  .r-score { font-family: "Do Hyeon", sans-serif; font-size: 66px; line-height: 1; }
  .r-score .pct { font-size: 34px; }
  .r-grade { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .r-comment { font-size: 13.5px; font-weight: 600; color: var(--ink-soft); margin-top: 4px; }
  .r-actions { display: flex; gap: 10px; margin-top: 12px; }
  .r-actions .btn { flex: 1; padding: 14px 8px; font-size: 15px; }
  .retry-line { margin-top: 10px; }
  .retry-line .btn { width: 100%; padding: 13px; font-size: 15px; }
  .save-hint { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-top: 10px; min-height: 15px; }

  .mute-btn { position: absolute; top: 14px; right: 14px; z-index: 20; border: none; border-radius: 999px;
    background: #1E2740; box-shadow: var(--shadow); cursor: pointer; font-size: 12px; font-weight: 800; color: var(--accent); padding: 7px 13px; }
  .toast { position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 16px); z-index: 30;
    background: #000; color: #fff; font-weight: 700; font-size: 14px; padding: 11px 20px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .save-modal { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; padding: 22px; }
  .save-modal.show { display: flex; }
  .save-modal-inner { background: var(--panel); border-radius: 22px; padding: 18px 16px; box-shadow: var(--shadow); max-width: 100%; max-height: 100%;
    overflow-y: auto; text-align: center; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--line); }
  .sm-title { font-size: 15px; font-weight: 800; } .sm-sub { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.5; margin: 4px 0 10px; }
  #saveModalImg { width: 100%; max-width: 250px; border-radius: 14px; }

  @media (min-width: 700px) {
    body { padding: 0; align-items: stretch; }
    .phone { width: 100vw; max-width: 100%; height: 100dvh; max-height: none; aspect-ratio: auto; border-radius: 0; border: none; }
    .canvas-wrap { max-width: 620px; width: calc(100% - 28px); margin: 0 auto; }
    .g-head, .result { max-width: 620px; margin-inline: auto; width: 100%; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <button class="mute-btn" id="muteBtn">소리</button>

  <!-- 시작 -->
  <section class="screen active" id="startScreen">
    <div class="ring-demo"></div>
    <h1>완벽한 <span class="hl">원</span> 그리기</h1>
    <p class="desc">가운데 점을 중심으로<br>동그라미를 한 번에 슥 그려보세요.<br>정확도 %가 바로 나옵니다.</p>
    <button class="btn primary big" id="startBtn">시작하기</button>
    <p class="best-note" id="startBest"></p>
  </section>

  <!-- 게임 -->
  <section class="screen" id="gameScreen">
    <div class="g-head">
      <button class="gh-back" id="backBtn">← 처음</button>
      <div class="gh-title">완벽한 원 그리기</div>
      <div class="gh-best" id="ghBest"></div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="hint" id="hint">가운데 점을 중심으로<br>원을 한 번에 그려보세요 ✍️</div>
    </div>
    <div class="result hide" id="result">
      <div class="r-score" id="rScore">0<span class="pct">%</span></div>
      <div class="r-grade" id="rGrade"></div>
      <div class="r-comment" id="rComment"></div>
      <div class="r-actions">
        <button class="btn ghost" id="saveBtn">결과 저장</button>
        <button class="btn ghost" id="shareBtn">자랑하기</button>
      </div>
      <div class="retry-line"><button class="btn primary" id="retryBtn">다시 그리기</button></div>
      <div class="save-hint" id="saveHint"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="save-modal" id="saveModal">
    <div class="save-modal-inner">
      <p class="sm-title">👆 이미지를 꾹 눌러 저장하세요</p>
      <p class="sm-sub">아이폰은 아래 이미지를 길게 눌러<br>'사진에 저장'을 선택하세요</p>
      <img id="saveModalImg" alt="결과" />
      <button class="btn soft" id="saveModalClose" style="margin-top:14px;padding:11px 30px;">닫기</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ---------- 사운드 ---------- */
const MUTE_KEY = "ccojik-circle-muted";
let audioCtx = null, muted = localStorage.getItem(MUTE_KEY) === "1";
function ac() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx; }
function beep(f, d, t, v, w) { if (muted) return; const c = ac(); if (!c) return; const t0 = c.currentTime + (w || 0); const o = c.createOscillator(), g = c.createGain(); o.type = t || "sine"; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v || 0.1, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + 0.02); }
function sfxScore(pct) { const base = 440 + pct * 6; beep(base, 0.1, "sine", 0.12); beep(base * 1.25, 0.12, "sine", 0.1, 0.09); if (pct >= 90) { beep(base * 1.5, 0.14, "sine", 0.12, 0.18); beep(base * 2, 0.16, "sine", 0.1, 0.28); } }
function sfxTick() { beep(600, 0.04, "sine", 0.06); }
function toggleMute() { muted = !muted; localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); $("muteBtn").textContent = muted ? "음소거" : "소리"; if (!muted) sfxTick(); }

/* ---------- 상태 ---------- */
const BEST_KEY = "ccojik-circle-best";
let canvas, ctx, W = 0, H = 0, dpr = 1, cxp = 0, cyp = 0;
let drawing = false, pts = [], curScore = 0;
function getBest() { const v = parseFloat(localStorage.getItem(BEST_KEY)); return isNaN(v) ? null : v; }
function setBest(v) { localStorage.setItem(BEST_KEY, String(v)); }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); }
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), 1600); }

/* ---------- 캔버스 ---------- */
function initCanvas() {
  canvas = $("canvas");
  const r = $("canvasWrap").getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(r.width); H = Math.round(r.height); cxp = W / 2; cyp = H / 2;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  clearCanvas();
}
function clearCanvas() {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#0C1120"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
  // 중심 점
  ctx.fillStyle = "#3A4670"; ctx.beginPath(); ctx.arc(cxp, cyp, 4, 0, 7); ctx.fill();
}
function posOf(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function onDown(e) {
  if (!ctx) return; e.preventDefault();
  $("result").classList.add("hide"); $("hint").classList.add("hide");
  clearCanvas();
  drawing = true; pts = [];
  const p = posOf(e); pts.push(p);
  ctx.strokeStyle = "#42E3C8"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x, p.y);
  sfxTick();
}
function onMove(e) {
  if (!drawing) return;
  const p = posOf(e); const last = pts[pts.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 2) return;
  pts.push(p); ctx.lineTo(p.x, p.y); ctx.stroke();
}
function onUp() { if (!drawing) return; drawing = false; finish(); }

/* ---------- 점수 계산 ---------- */
function finish() {
  if (pts.length < 20) { $("hint").classList.remove("hide"); toast("원을 크게 한 번에 그려주세요"); return; }
  let sx = 0, sy = 0; pts.forEach(p => { sx += p.x; sy += p.y; });
  const cx = sx / pts.length, cy = sy / pts.length;
  const radii = pts.map(p => Math.hypot(p.x - cx, p.y - cy));
  const meanR = radii.reduce((a, b) => a + b, 0) / radii.length;
  if (meanR < 24) { $("hint").classList.remove("hide"); toast("조금 더 크게 그려주세요"); return; }
  // 각도 스윕(원을 끝까지 돌았는지)
  let sweep = 0;
  for (let i = 1; i < pts.length; i++) {
    const a0 = Math.atan2(pts[i - 1].y - cy, pts[i - 1].x - cx);
    const a1 = Math.atan2(pts[i].y - cy, pts[i].x - cx);
    let d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    sweep += d;
  }
  if (Math.abs(sweep) < 5.2) { $("hint").classList.remove("hide"); toast("원을 끝까지 한 바퀴 그려주세요"); return; }
  // 반지름 표준편차 → 정확도
  const varr = radii.reduce((a, r) => a + (r - meanR) * (r - meanR), 0) / radii.length;
  const std = Math.sqrt(varr);
  const ratio = std / meanR;
  let score = Math.round(100 - ratio * 310);
  score = Math.max(0, Math.min(100, score));
  curScore = score;
  // 완벽한 원 오버레이
  ctx.strokeStyle = "rgba(245,196,81,.9)"; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.arc(cx, cy, meanR, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  showResult(score);
}
const GRADES = [
  { min: 98, g: "신의 손! 컴퍼스세요?", c: "이건 사람이 그린 게 아니야" },
  { min: 92, g: "거의 완벽 ✨", c: "손 떨림 0. 존경합니다" },
  { min: 83, g: "동그라미 인정", c: "누가 봐도 원. 합격!" },
  { min: 70, g: "음… 원 맞죠?", c: "살짝 찌그러졌지만 봐줄게요" },
  { min: 52, g: "찌그러진 감자", c: "이게 최선입니까?" },
  { min: 0, g: "이건… 원이 아니야", c: "다시 도전해봐요 ^^" },
];
function showResult(score) {
  const gr = GRADES.find(x => score >= x.min);
  $("rGrade").textContent = gr.g; $("rComment").textContent = gr.c;
  const best = getBest(); const isNew = best === null || score > best;
  if (isNew) setBest(score);
  refreshBest();
  $("saveHint").textContent = ""; $("result").classList.remove("hide");
  sfxScore(score);
  // 숫자 카운트업
  const el = $("rScore"); let n = 0; const step = Math.max(1, Math.round(score / 22));
  clearInterval(el._t);
  el._t = setInterval(() => { n += step; if (n >= score) { n = score; clearInterval(el._t); if (isNew && score > 0) setTimeout(() => toast("🎉 최고 기록 갱신! " + score + "%"), 300); } el.innerHTML = n + '<span class="pct">%</span>'; el.style.color = score >= 83 ? "var(--good)" : score >= 52 ? "var(--mid)" : "var(--bad)"; }, 24);
}
function refreshBest() { const b = getBest(); const t = b === null ? "" : "최고 " + b + "%"; $("ghBest").textContent = t; $("startBest").textContent = b === null ? "" : "🏆 내 최고 기록: " + b + "%"; }

/* ---------- 결과 카드 ---------- */
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
async function buildCard() {
  const W2 = 1080, H2 = 1350, cx = W2 / 2;
  const cv = document.createElement("canvas"); cv.width = W2; cv.height = H2;
  const c = cv.getContext("2d");
  try { await document.fonts.ready; } catch (e) {}
  const FF = '"Do Hyeon", "Pretendard Variable", Pretendard, sans-serif';
  c.fillStyle = "#0F1424"; c.fillRect(0, 0, W2, H2); c.textAlign = "center";
  c.fillStyle = "#42E3C8"; c.font = "800 58px " + FF; c.fillText("완벽한 원 그리기", cx, 130);
  // 내 그림 박스
  const bx = 90, by = 200, bw = W2 - 180, bh = bw;
  c.fillStyle = "#0C1120"; roundRect(c, bx, by, bw, bh, 30); c.fill();
  c.save(); roundRect(c, bx, by, bw, bh, 30); c.clip();
  c.drawImage(canvas, bx, by, bw, bh);
  c.restore();
  c.strokeStyle = "#2A3350"; c.lineWidth = 3; roundRect(c, bx, by, bw, bh, 30); c.stroke();
  // 점수
  const col = curScore >= 83 ? "#42E3C8" : curScore >= 52 ? "#F5C451" : "#F5677E";
  c.fillStyle = col; c.font = "800 150px " + FF; c.fillText(curScore + "%", cx, by + bh + 170);
  const gr = GRADES.find(x => curScore >= x.min);
  c.fillStyle = "#EAF0FF"; c.font = "800 48px " + FF; c.fillText(gr.g, cx, by + bh + 240);
  c.fillStyle = "#42E3C8"; c.font = "800 46px " + FF; c.fillText("@ccojik.dh", cx, 1270);
  c.fillStyle = "#8A97BD"; c.font = "600 32px " + '"Pretendard Variable", Pretendard, sans-serif'; c.fillText("너도 완벽한 원 그려봐 ^^", cx, 1318);
  return cv;
}

/* ---------- 저장/공유 ---------- */
const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function supportsDownload() { return !isIOS && typeof document.createElement("a").download !== "undefined"; }
let saveURL = null;
function openSaveModal(u) { if (saveURL) URL.revokeObjectURL(saveURL); saveURL = u; $("saveModalImg").src = u; $("saveModal").classList.add("show"); }
function closeSaveModal() { $("saveModal").classList.remove("show"); $("saveModalImg").removeAttribute("src"); if (saveURL) { URL.revokeObjectURL(saveURL); saveURL = null; } }
async function saveCard() {
  try {
    const cv = await buildCard();
    cv.toBlob(blob => {
      if (!blob) { $("saveHint").textContent = "저장에 문제가 생겼어요. 화면을 캡처해 주세요 🙏"; return; }
      const u = URL.createObjectURL(blob);
      if (!supportsDownload()) { openSaveModal(u); return; }
      const a = document.createElement("a"); a.href = u; a.download = "완벽한원_" + curScore + ".png";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      $("saveHint").textContent = "저장 완료!";
    }, "image/png");
  } catch (e) { $("saveHint").textContent = "저장에 문제가 생겼어요. 화면을 캡처해 주세요 🙏"; }
}
async function shareResult() {
  const url = location.href.split("?")[0].split("#")[0];
  const text = "나 완벽한 원 " + curScore + "% 나옴 ㅋㅋ 너도 해봐!";
  try {
    if (navigator.canShare) {
      const cv = await buildCard();
      const blob = await new Promise(r => cv.toBlob(r, "image/png"));
      if (blob) { const file = new File([blob], "완벽한원.png", { type: "image/png" });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text, url }); return; } }
    }
  } catch (e) {}
  if (navigator.share) { try { await navigator.share({ title: "완벽한 원 그리기", text, url }); return; } catch (e) {} }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text + " " + url).then(() => toast("링크 복사됨! 친구한테 붙여넣기 ^^"), () => toast("복사 실패")); }
  else toast("주소창 링크를 복사해 보내주세요");
}

/* ---------- 이벤트 ---------- */
$("startBtn").addEventListener("click", () => { sfxTick(); show("gameScreen"); requestAnimationFrame(() => { initCanvas(); refreshBest(); $("hint").classList.remove("hide"); $("result").classList.add("hide"); }); });
$("backBtn").addEventListener("click", () => { sfxTick(); show("startScreen"); refreshBest(); });
$("retryBtn").addEventListener("click", () => { sfxTick(); clearCanvas(); $("result").classList.add("hide"); $("hint").classList.remove("hide"); });
$("saveBtn").addEventListener("click", saveCard);
$("shareBtn").addEventListener("click", shareResult);
