<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>네온 사인 만들기</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="네온 사인 만들기" />
<meta property="og:description" content="어두운 벽에 빛나는 네온으로 나만의 간판 만들기 ^^" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nanum+Pen+Script&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#0a0a0e; --panel:#15151c; --panel2:#1e1e28; --ink:#EDEBF5; --ink-soft:#8B889E; --line:#2a2a36;
    --accent:#ff2d95; --shadow:0 14px 40px rgba(0,0,0,.5); }
  html, body { height: 100%; font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; color: var(--ink);
    -webkit-user-select: none; user-select: none; background: #050507; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 8px; }
  .phone { position: relative; width: min(440px, 96vw); aspect-ratio: 9/16; max-height: 98dvh;
    background: var(--bg); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); }

  /* 시작 */
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }
  #startScreen { align-items: center; justify-content: safe center; text-align: center; padding: 26px 22px;
    background: radial-gradient(circle at 50% 34%, #17111f 0%, transparent 60%), #08080c; }
  .neon-logo { font-family: "Pacifico", cursive; font-size: 46px; color: #fff; line-height: 1.15; margin-bottom: 6px;
    text-shadow: 0 0 6px #fff, 0 0 14px var(--accent), 0 0 28px var(--accent), 0 0 48px var(--accent); animation: buzz 4s infinite; }
  .neon-sub { font-family: "Nanum Pen Script", cursive; font-size: 30px; color: #18e0ff; margin-top: 2px;
    text-shadow: 0 0 5px #cff, 0 0 12px #18e0ff, 0 0 26px #18e0ff; animation: buzz 5.5s infinite; }
  @keyframes buzz { 0%,18%,22%,54%,58%,100%{opacity:1} 20%,56%{opacity:.72} 19%{opacity:.9} }
  .desc { font-size: 14.5px; font-weight: 600; color: var(--ink-soft); margin-top: 20px; line-height: 1.7; }
  .btn { font-family: inherit; font-weight: 800; cursor: pointer; border: none; border-radius: 15px; transition: transform .1s ease; }
  .btn:active { transform: scale(.96); }
  .start-btn { margin-top: 24px; font-size: 18px; font-weight: 800; padding: 15px 44px; border-radius: 16px; cursor: pointer; border: 2px solid var(--accent);
    background: transparent; color: #fff; text-shadow: 0 0 8px var(--accent); box-shadow: 0 0 10px var(--accent), inset 0 0 10px rgba(255,45,149,.3); }

  /* 에디터 */
  .topbar { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 10px 12px; }
  .topbar .tt { font-family: "Pacifico", cursive; font-size: 17px; color: #fff; flex: 1;
    text-shadow: 0 0 6px var(--accent), 0 0 14px var(--accent); }
  .mini { background: var(--panel2); color: var(--ink); border: none; font-family: inherit; font-weight: 700; font-size: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .mini.on { color: #18e0ff; box-shadow: inset 0 0 0 1.5px #18e0ff; }

  .stage { position: relative; flex: 1; margin: 0 12px; border-radius: 16px; overflow: hidden; min-height: 0; box-shadow: 0 0 0 1px var(--line); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fx { touch-action: none; }
  #fx.flicker { animation: neonParty 2s infinite; }
  @keyframes neonParty {
    0%   { opacity:1; filter:brightness(1) saturate(1.2) hue-rotate(0deg) drop-shadow(0 0 6px rgba(255,255,255,.3)); }
    4%   { opacity:.3; }
    5%   { opacity:1; filter:brightness(2) saturate(1.7) hue-rotate(12deg) drop-shadow(0 0 22px rgba(255,255,255,.6)); }
    7%   { opacity:.6; }
    9%   { opacity:1; filter:brightness(1.3) saturate(1.4) hue-rotate(-8deg) drop-shadow(0 0 10px rgba(120,220,255,.45)); }
    24%  { filter:brightness(1.2) saturate(1.6) hue-rotate(24deg) drop-shadow(0 0 16px rgba(120,220,255,.5)); }
    38%  { opacity:1; filter:brightness(1) saturate(1.2) hue-rotate(0deg) drop-shadow(0 0 8px rgba(255,255,255,.3)); }
    40%  { opacity:.18; }
    41%  { opacity:1; filter:brightness(2.2) saturate(1.8) hue-rotate(-14deg) drop-shadow(0 0 24px rgba(255,120,220,.6)); }
    43%  { opacity:.5; }
    45%  { opacity:1; }
    58%  { filter:brightness(1.25) saturate(1.6) hue-rotate(-24deg) drop-shadow(0 0 16px rgba(255,180,120,.5)); }
    69%  { opacity:1; filter:brightness(1); }
    70%  { opacity:.32; }
    71%  { opacity:1; filter:brightness(2) saturate(1.7) hue-rotate(16deg) drop-shadow(0 0 22px rgba(150,255,170,.55)); }
    73%  { opacity:.7; }
    74%  { opacity:1; }
    86%  { filter:brightness(1.15) saturate(1.5) hue-rotate(30deg) drop-shadow(0 0 14px rgba(200,150,255,.5)); }
    88%  { opacity:1; }
    89%  { opacity:.22; }
    90%  { opacity:1; filter:brightness(2) saturate(1.7) hue-rotate(8deg) drop-shadow(0 0 20px rgba(255,255,255,.55)); }
    92%  { opacity:.65; }
    93%  { opacity:1; }
    100% { opacity:1; filter:brightness(1) saturate(1.2) hue-rotate(0deg) drop-shadow(0 0 6px rgba(255,255,255,.3)); }
  }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; pointer-events: none;
    font-family: "Nanum Pen Script", cursive; font-size: 26px; color: rgba(255,255,255,.5); text-shadow: 0 0 8px rgba(255,255,255,.4); }
  .hint.hide { display: none; }

  .wallrow { flex-shrink: 0; display: none; gap: 6px; overflow-x: auto; padding: 8px 12px 2px; scrollbar-width: none; }
  .wallrow::-webkit-scrollbar { display: none; }
  .wallrow.show { display: flex; }
  .wchip { flex: 0 0 auto; background: var(--panel2); color: var(--ink); border: 2px solid transparent; border-radius: 10px;
    font-family: inherit; font-weight: 700; font-size: 12px; padding: 8px 13px; cursor: pointer; white-space: nowrap; }
  .wchip.on { border-color: #18e0ff; color: #18e0ff; box-shadow: 0 0 8px rgba(24,224,255,.4); }

  .palette { flex-shrink: 0; display: flex; gap: 8px; justify-content: center; padding: 10px 12px 4px; flex-wrap: wrap; }
  .sw { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,.15); transition: transform .1s; }
  .sw:active { transform: scale(.9); }
  .sw.on { border-color: #fff; transform: scale(1.12); }

  .toolrow { flex-shrink: 0; display: flex; gap: 8px; justify-content: center; padding: 6px 12px; }
  .seg { display: flex; background: var(--panel); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { background: transparent; color: var(--ink-soft); border: none; font-family: inherit; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 9px; cursor: pointer; }
  .seg button.on { background: var(--panel2); color: #fff; }

  .textrow { flex-shrink: 0; padding: 2px 12px 6px; display: none; }
  .textrow.show { display: block; }
  .textrow input { width: 100%; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; color: #fff;
    font-family: inherit; font-size: 15px; font-weight: 600; padding: 11px 14px; outline: none; }
  .textrow input:focus { border-color: var(--accent); }
  .textrow .tip { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin-top: 5px; text-align: center; }

  .bottombar { flex-shrink: 0; display: flex; gap: 8px; padding: 4px 12px calc(12px + env(safe-area-inset-bottom)); }
  .bottombar .btn { flex: 1; padding: 13px 4px; font-size: 14px; }
  .btn.soft { background: var(--panel2); color: var(--ink); }
  .btn.pink { background: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(255,45,149,.4); }
  .btn.cyan { background: transparent; color: #18e0ff; box-shadow: inset 0 0 0 1.5px #18e0ff; }

  .toast { position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 16px); z-index: 30;
    background: #000; color: #fff; font-weight: 700; font-size: 14px; padding: 11px 20px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .save-modal { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; padding: 20px; }
  .save-modal.show { display: flex; }
  .save-modal-inner { background: var(--panel); border-radius: 20px; padding: 18px 16px; box-shadow: var(--shadow); max-width: 100%; max-height: 100%;
    overflow-y: auto; text-align: center; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--line); }
  .sm-title { font-size: 15px; font-weight: 800; } .sm-sub { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.5; margin: 4px 0 10px; }
  #saveModalImg { width: 100%; max-width: 250px; border-radius: 12px; }

  @media (min-width: 700px) {
    body { padding: 0; align-items: stretch; }
    .phone { width: 100vw; max-width: 100%; height: 100dvh; max-height: none; aspect-ratio: auto; border-radius: 0; border: none; }
    .stage { max-width: 720px; width: calc(100% - 24px); margin-inline: auto; }
    .topbar, .palette, .toolrow, .textrow, .bottombar { max-width: 720px; margin-inline: auto; width: 100%; }
  }
</style>
</head>
<body>
<div class="phone">
  <!-- 시작 -->
  <section class="screen active" id="startScreen">
    <div class="neon-logo">Neon Sign</div>
    <div class="neon-sub">네온 사인 만들기</div>
    <p class="desc">어두운 벽에 빛나는 네온으로<br>글씨도 쓰고 그림도 그려서<br>나만의 간판을 만들어보세요.</p>
    <button class="start-btn" id="startBtn">만들러 가기</button>
  </section>

  <!-- 에디터 -->
  <section class="screen" id="editScreen">
    <div class="topbar">
      <div class="tt">Neon</div>
      <button class="mini" id="wallBtn">🖼️ 배경</button>
      <button class="mini" id="flickBtn">✨ 깜빡임</button>
      <button class="mini" id="backBtn">처음</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="bg"></canvas>
      <canvas id="fx"></canvas>
      <div class="hint" id="hint">여기에 손으로 그려보세요 ✍️</div>
    </div>
    <div class="wallrow" id="wallrow"></div>
    <div class="palette" id="palette"></div>
    <div class="toolrow">
      <div class="seg" id="toolSeg">
        <button data-tool="brush" class="on">✏️ 브러시</button>
        <button data-tool="text">🔤 글자</button>
      </div>
      <div class="seg" id="sizeSeg">
        <button data-size="0">S</button>
        <button data-size="1" class="on">M</button>
        <button data-size="2">L</button>
      </div>
    </div>
    <div class="textrow" id="textrow">
      <input id="textInput" placeholder="네온 글자 입력…" maxlength="24" />
      <div class="tip">글자를 입력한 뒤 화면을 <b>탭</b>하면 놓여요</div>
    </div>
    <div class="bottombar">
      <button class="btn soft" id="undoBtn">되돌리기</button>
      <button class="btn soft" id="clearBtn">전체 지우기</button>
      <button class="btn cyan" id="saveBtn">저장</button>
      <button class="btn pink" id="shareBtn">공유</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="save-modal" id="saveModal">
    <div class="save-modal-inner">
      <p class="sm-title">👆 이미지를 꾹 눌러 저장하세요</p>
      <p class="sm-sub">아이폰은 아래 이미지를 길게 눌러<br>'사진에 저장'을 선택하세요</p>
      <img id="saveModalImg" alt="네온 사인" />
      <button class="btn soft" id="saveModalClose" style="margin-top:14px;padding:11px 30px;">닫기</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ================= 설정 ================= */
const NEON = [
  { n: "핑크", c: "#ff2d95" }, { n: "블루", c: "#18e0ff" }, { n: "그린", c: "#39ff5e" },
  { n: "옐로우", c: "#ffe14d" }, { n: "오렌지", c: "#ff8a3d" }, { n: "퍼플", c: "#b46bff" },
  { n: "레드", c: "#ff3b52" }, { n: "화이트", c: "#f2f6ff" },
];
const SIZES = [6, 11, 18];           // 브러시 굵기
const TEXTSIZE = [30, 50, 78];       // 글자 크기(굵기 단계에 대응)
const WALLS = [
  { k: "brick", label: "벽돌" },
  { k: "dark", label: "어둠" },
  { k: "city", label: "도시야경" },
  { k: "sunset", label: "노을" },
  { k: "cyber", label: "사이버" },
  { k: "purple", label: "보라빛" },
  { k: "stars", label: "별밤" },
  { k: "holo", label: "홀로그램" },
  { k: "night", label: "밤하늘" },
];
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= 상태 ================= */
let bgc, bgx, fx, fxx, W = 0, H = 0, dpr = 1;
let tool = "brush", colorIdx = 0, sizeIdx = 1, wallIdx = 0, flicker = false;
let items = [], cur = null, drawing = false;
const color = () => NEON[colorIdx].c;

function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); }
let toastTimer = null;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600); }

/* ================= 캔버스 ================= */
function initCanvas() {
  bgc = $("bg"); fx = $("fx"); bgx = bgc.getContext("2d"); fxx = fx.getContext("2d");
  sizeCanvas();
}
function sizeCanvas() {
  const r = $("stage").getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(r.width); H = Math.round(r.height);
  [bgc, fx].forEach(cv => { cv.width = W * dpr; cv.height = H * dpr; });
  drawWall(bgx, dpr, WALLS[wallIdx].k);
  render();
}

/* --- 벽 배경 --- */
function drawWall(ctx, s, kind) {
  const w = W * s, h = H * s;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  const linGrad = (stops) => { const g = ctx.createLinearGradient(0, 0, 0, h); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
  if (kind === "brick") {
    ctx.fillStyle = "#1a1412"; ctx.fillRect(0, 0, w, h);
    const bh = 26 * s, bw = 56 * s;
    ctx.lineWidth = 2 * s; ctx.strokeStyle = "rgba(0,0,0,.45)";
    let row = 0;
    for (let y = 0; y <= h; y += bh, row++) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      const off = (row % 2) ? bw / 2 : 0;
      for (let x = -bw + off; x <= w; x += bw) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + bh); ctx.stroke(); }
    }
    ctx.strokeStyle = "rgba(255,255,255,.03)";
    for (let y = 0; y <= h; y += bh) { ctx.beginPath(); ctx.moveTo(0, y + 1.5 * s); ctx.lineTo(w, y + 1.5 * s); ctx.stroke(); }
  } else if (kind === "dark") {
    const g = ctx.createRadialGradient(w / 2, h * 0.38, 10, w / 2, h / 2, Math.max(w, h) * 0.9);
    g.addColorStop(0, "#262630"); g.addColorStop(1, "#0d0d12"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  } else if (kind === "night") {
    ctx.fillStyle = linGrad([[0, "#0b1030"], [1, "#05060f"]]); ctx.fillRect(0, 0, w, h);
  } else if (kind === "city") {
    ctx.fillStyle = linGrad([[0, "#1a1140"], [0.55, "#2a1a55"], [1, "#0a0a1e"]]); ctx.fillRect(0, 0, w, h);
    const r = mulberry(7); const cols = ["#ff6ad5", "#18e0ff", "#ffd36b", "#9b6bff", "#6bffcf"];
    for (let i = 0; i < 30; i++) { const x = r() * w, y = r() * h * 0.82, rad = (6 + r() * 24) * s; const col = cols[(r() * cols.length) | 0]; const rg = ctx.createRadialGradient(x, y, 0, x, y, rad); rg.addColorStop(0, col + "cc"); rg.addColorStop(1, col + "00"); ctx.fillStyle = rg; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
    let bx = 0; while (bx < w) { const bw = (30 + r() * 44) * s, bh = (60 + r() * 170) * s; ctx.fillStyle = "#06060f"; ctx.fillRect(bx, h - bh, bw, bh); ctx.fillStyle = "rgba(255,220,120,.22)"; for (let wy = h - bh + 10 * s; wy < h - 10 * s; wy += 16 * s) for (let wx = bx + 7 * s; wx < bx + bw - 7 * s; wx += 14 * s) if (r() > 0.5) ctx.fillRect(wx, wy, 5 * s, 7 * s); bx += bw + 4 * s; }
  } else if (kind === "sunset") {
    ctx.fillStyle = linGrad([[0, "#2b1a4d"], [0.42, "#7a2b6d"], [0.68, "#c84b6a"], [0.82, "#e07a4e"], [1, "#3a1530"]]); ctx.fillRect(0, 0, w, h);
    const sg = ctx.createRadialGradient(w / 2, h * 0.74, 4, w / 2, h * 0.74, h * 0.55); sg.addColorStop(0, "#ffdf9acc"); sg.addColorStop(1, "#ffdf9a00"); ctx.fillStyle = sg; ctx.fillRect(0, 0, w, h);
  } else if (kind === "cyber") {
    ctx.fillStyle = linGrad([[0, "#12042a"], [0.55, "#2a0a4a"], [1, "#05010f"]]); ctx.fillRect(0, 0, w, h);
    const hz = h * 0.6;
    const sg = ctx.createLinearGradient(0, hz - 44 * s, 0, hz + 44 * s); sg.addColorStop(0, "#ff2d9500"); sg.addColorStop(0.5, "#ff2d95aa"); sg.addColorStop(1, "#ff2d9500"); ctx.fillStyle = sg; ctx.fillRect(0, hz - 44 * s, w, 88 * s);
    ctx.strokeStyle = "rgba(24,224,255,.5)"; ctx.lineWidth = 1.5 * s;
    for (let i = 1; i <= 10; i++) { const y = hz + (h - hz) * (i * i / 100); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    for (let i = -10; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(w / 2 + i * (w / 40), hz); ctx.lineTo(w / 2 + i * (w / 9), h); ctx.stroke(); }
  } else if (kind === "purple") {
    const g = ctx.createRadialGradient(w / 2, h * 0.4, 10, w / 2, h * 0.5, Math.max(w, h));
    g.addColorStop(0, "#4a1d7a"); g.addColorStop(0.6, "#240f45"); g.addColorStop(1, "#0a0518"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  } else if (kind === "stars") {
    ctx.fillStyle = linGrad([[0, "#0e0a2a"], [1, "#050510"]]); ctx.fillRect(0, 0, w, h);
    const r = mulberry(21);
    for (let i = 0; i < 100; i++) { const x = r() * w, y = r() * h, rad = (0.6 + r() * 1.9) * s; ctx.globalAlpha = 0.4 + r() * 0.6; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (let i = 0; i < 7; i++) { const x = r() * w, y = r() * h * 0.7; const rg = ctx.createRadialGradient(x, y, 0, x, y, 11 * s); rg.addColorStop(0, "#bcd8ffcc"); rg.addColorStop(1, "#bcd8ff00"); ctx.fillStyle = rg; ctx.fillRect(x - 11 * s, y - 11 * s, 22 * s, 22 * s); }
  } else if (kind === "holo") {
    ctx.fillStyle = "#0a0a14"; ctx.fillRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#3a1560"); g.addColorStop(0.3, "#123a66"); g.addColorStop(0.55, "#12664f"); g.addColorStop(0.8, "#6a2a66"); g.addColorStop(1, "#201040");
    ctx.globalAlpha = 0.75; ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(0,0,0,.32)"; ctx.fillRect(0, 0, w, h);
  }
}

/* --- 네온 렌더 --- */
function tracePath(ctx, pts, s, lw, blur) {
  ctx.lineWidth = lw; ctx.shadowBlur = blur;
  if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x * s, pts[0].y * s, lw / 2, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(pts[0].x * s, pts[0].y * s);
  for (let i = 1; i < pts.length - 1; i++) { const mx = (pts[i].x + pts[i + 1].x) / 2 * s, my = (pts[i].y + pts[i + 1].y) / 2 * s; ctx.quadraticCurveTo(pts[i].x * s, pts[i].y * s, mx, my); }
  ctx.lineTo(pts[pts.length - 1].x * s, pts[pts.length - 1].y * s); ctx.stroke();
}
function drawStroke(ctx, st, s) {
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineJoin = ctx.lineCap = "round";
  ctx.strokeStyle = st.color; ctx.shadowColor = st.color;
  // 넓은 후광 → 중간 광 → 진한 튜브 → 흰빛 코어
  ctx.globalAlpha = 0.5; tracePath(ctx, st.points, s, st.width * 1.2 * s, 50 * s);
  ctx.globalAlpha = 0.75; tracePath(ctx, st.points, s, st.width * s, 28 * s);
  ctx.globalAlpha = 1; tracePath(ctx, st.points, s, st.width * 0.72 * s, 13 * s);
  tracePath(ctx, st.points, s, st.width * 0.5 * s, 7 * s);
  ctx.strokeStyle = "rgba(255,255,255,.96)"; ctx.shadowColor = st.color;
  tracePath(ctx, st.points, s, Math.max(1.8, st.width * 0.26) * s, 4 * s);
  ctx.restore();
}
function drawText(ctx, it, s) {
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = (it.size * s) + 'px "Pacifico","Nanum Pen Script",cursive';
  ctx.shadowColor = it.color; ctx.fillStyle = it.color;
  ctx.globalAlpha = 0.5; ctx.shadowBlur = 48 * s; ctx.fillText(it.text, it.x * s, it.y * s);
  ctx.globalAlpha = 0.8; ctx.shadowBlur = 26 * s; ctx.fillText(it.text, it.x * s, it.y * s);
  ctx.globalAlpha = 1; ctx.shadowBlur = 13 * s; ctx.fillText(it.text, it.x * s, it.y * s);
  ctx.shadowBlur = 6 * s; ctx.fillText(it.text, it.x * s, it.y * s);
  ctx.shadowBlur = 4 * s; ctx.fillStyle = "rgba(255,255,255,.96)"; ctx.fillText(it.text, it.x * s, it.y * s);
  ctx.restore();
}
function renderTo(ctx, s) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W * s, H * s);
  const all = cur ? items.concat([cur]) : items;
  for (const it of all) { if (it.type === "text") drawText(ctx, it, s); else drawStroke(ctx, it, s); }
}
let rafPending = false;
function render() { renderTo(fxx, dpr); }
function requestRender() { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; render(); }); }

/* ================= 입력 ================= */
function pos(e) { const r = fx.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hideHint() { $("hint").classList.add("hide"); }
function onDown(e) {
  e.preventDefault(); hideHint();
  const p = pos(e);
  if (tool === "text") {
    const t = $("textInput").value.trim();
    if (!t) { toast("먼저 네온 글자를 입력하세요"); $("textInput").focus(); return; }
    items.push({ type: "text", text: t, color: color(), size: TEXTSIZE[sizeIdx], x: p.x, y: p.y });
    render(); return;
  }
  drawing = true; cur = { type: "stroke", color: color(), width: SIZES[sizeIdx], points: [p] }; requestRender();
}
function onMove(e) {
  if (!drawing) return;
  const p = pos(e); const last = cur.points[cur.points.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 1.6) return;
  cur.points.push(p); requestRender();
}
function onUp() { if (!drawing) return; drawing = false; if (cur && cur.points.length) items.push(cur); cur = null; render(); }

/* ================= 저장/공유 ================= */
function buildExport() {
  const EW = 1080, s = EW / W, EH = Math.round(H * s);
  const cv = document.createElement("canvas"); cv.width = EW; cv.height = EH;
  const ctx = cv.getContext("2d");
  drawWall(ctx, s, WALLS[wallIdx].k);
  renderTo(ctx, s);
  // 워터마크(우하단, 은은하게)
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "lighter";
  ctx.textAlign = "right"; ctx.textBaseline = "bottom";
  ctx.font = '34px "Pacifico", cursive'; ctx.shadowColor = "#18e0ff"; ctx.fillStyle = "rgba(120,220,255,.55)";
  ctx.shadowBlur = 14; ctx.fillText("@ccojik.dh", EW - 34, EH - 30);
  return cv;
}
function hasContent() { return items.length > 0; }
const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function supportsDownload() { return !isIOS && typeof document.createElement("a").download !== "undefined"; }
let saveURL = null;
function openSaveModal(u) { if (saveURL) URL.revokeObjectURL(saveURL); saveURL = u; $("saveModalImg").src = u; $("saveModal").classList.add("show"); }
function closeSaveModal() { $("saveModal").classList.remove("show"); $("saveModalImg").removeAttribute("src"); if (saveURL) { URL.revokeObjectURL(saveURL); saveURL = null; } }
function saveSign() {
  if (!hasContent()) { toast("먼저 네온을 그려주세요"); return; }
  try {
    buildExport().toBlob(blob => {
      if (!blob) { toast("저장 실패 — 화면을 캡처해 주세요"); return; }
      const u = URL.createObjectURL(blob);
      if (!supportsDownload()) { openSaveModal(u); return; }
      const a = document.createElement("a"); a.href = u; a.download = "ccojik_neon.png";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      toast("저장 완료! 📸");
    }, "image/png");
  } catch (e) { toast("저장 실패 — 화면을 캡처해 주세요"); }
}
async function shareSign() {
  if (!hasContent()) { toast("먼저 네온을 그려주세요"); return; }
  const url = location.href.split("?")[0].split("#")[0];
  const text = "내가 만든 네온 사인 ✨ 너도 만들어봐!";
  try {
    if (navigator.canShare) {
      const blob = await new Promise(r => buildExport().toBlob(r, "image/png"));
      if (blob) { const file = new File([blob], "neon.png", { type: "image/png" });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text, url }); return; } }
    }
  } catch (e) {}
  if (navigator.share) { try { await navigator.share({ title: "네온 사인 만들기", text, url }); return; } catch (e) {} }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text + " " + url).then(() => toast("링크 복사됨!"), () => toast("복사 실패")); }
  else toast("주소창 링크를 복사해 보내주세요");
}

/* ================= UI 빌드 ================= */
function buildPalette() {
  const box = $("palette"); box.innerHTML = "";
  NEON.forEach((n, i) => {
    const el = document.createElement("div");
    el.className = "sw" + (i === colorIdx ? " on" : "");
    el.style.background = n.c;
    el.style.boxShadow = "0 0 8px " + n.c + ", 0 0 14px " + n.c;
    el.title = n.n;
    el.addEventListener("click", () => { colorIdx = i; buildPalette(); });
    box.appendChild(el);
  });
}
function setTool(t) {
  tool = t;
  $("toolSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
  $("textrow").classList.toggle("show", t === "text");
  if (t === "text") setTimeout(() => $("textInput").focus(), 50);
}
function setSize(i) { sizeIdx = i; $("sizeSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.size === i)); }
function buildWalls() {
  const box = $("wallrow"); box.innerHTML = "";
  WALLS.forEach((wl, i) => {
    const el = document.createElement("div");
    el.className = "wchip" + (i === wallIdx ? " on" : "");
    el.textContent = wl.label;
    el.addEventListener("click", () => { wallIdx = i; if (bgx) drawWall(bgx, dpr, wl.k); buildWalls(); });
    box.appendChild(el);
  });
}
function toggleWallRow() { const on = $("wallrow").classList.toggle("show"); $("wallBtn").classList.toggle("on", on); }
function toggleFlicker() { flicker = !flicker; fx.classList.toggle("flicker", flicker); $("flickBtn").classList.toggle("on", flicker); }

/* ================= 이벤트 ================= */
$("startBtn").addEventListener("click", () => { show("editScreen"); requestAnimationFrame(() => { initCanvas(); }); });
$("backBtn").addEventListener("click", () => show("startScreen"));
$("wallBtn").addEventListener("click", toggleWallRow);
$("flickBtn").addEventListener("click", toggleFlicker);
$("toolSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTool(b.dataset.tool); });
$("sizeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setSize(+b.dataset.size); });
$("undoBtn").addEventListener("click", () => { items.pop(); render(); if (!items.length) $("hint").classList.remove("hide"); });
$("clearBtn").addEventListener("click", () => { items = []; cur = null; render(); $("hint").classList.remove("hide"); });
$("saveBtn").addEventListener("click", saveSign);
$("shareBtn").addEventListener("click", shareSign);
$("saveModalClose").addEventListener("click", closeSaveModal);
$("saveModal").addEventListener("click", e => { if (e.target === $("saveModal")) closeSaveModal(); });

$("fx").addEventListener("pointerdown", onDown);
window.addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);
let resizeTm = null;
window.addEventListener("resize", () => { if (!$("editScreen").classList.contains("active")) return; clearTimeout(resizeTm); resizeTm = setTimeout(sizeCanvas, 200); });

buildPalette();
buildWalls();
</script>
</body>
