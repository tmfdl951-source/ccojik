<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>이거 누구게? · 몽타주 만들기</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="이거 누구게? · 몽타주 만들기" />
<meta property="og:description" content="사람을 찾습니다. 눈·코·입·머리를 맞춰 몽타주 전단지를 만들어보세요!" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- 전단지 제목용 굵은 글씨 + 본문 고딕 -->
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">
  <button class="mute" type="button" id="muteBtn">소리</button>

  <!-- ===== 시작 ===== -->
  <section class="screen on" id="startScreen">
    <div class="flyer">
      <div class="f-head"><h1>사람을 찾습니다</h1></div>
      <p class="f-sub">몽타주 만들기</p>
      <div class="f-photo"><div class="f-art" id="startArt"></div></div>
      <p class="f-desc">
        얼굴형·머리·눈·코·입을 맞춰<br>
        “그 사람” 몽타주 전단지를 만들어보세요.
      </p>
      <div class="f-btns">
        <button class="btn big" type="button" id="startBtn">몽타주 만들기</button>
        <button class="btn ghost" type="button" id="startRnd">아무렇게나 한 장</button>
      </div>
      <p class="f-foot">정답은 만든 사람만 알고 있음</p>
    </div>
  </section>

  <!-- ===== 만들기 ===== -->
  <section class="screen" id="buildScreen">
    <div class="flyer build">
      <div class="f-head small">
        <button class="f-back" type="button" id="backBtn">&#8592;</button>
        <h1>사람을 찾습니다</h1>
        <span class="f-no" id="fNo">제 0000 호</span>
      </div>
      <div class="f-photo"><div class="f-art" id="faceArt"></div></div>
      <!-- 빈 칸은 직접 적는다. 안 적으면 고른 파츠로 지어낸 글이 들어간다. -->
      <div class="f-form">
        <div class="ff-row">
          <label class="ff-k" for="inName">이 름</label>
          <input class="ff-v" id="inName" type="text" maxlength="12"
            autocomplete="off" enterkeyhint="done" placeholder="이름을 입력하세요" />
        </div>
        <div class="ff-row">
          <label class="ff-k" for="inNick">별 명</label>
          <input class="ff-v" id="inNick" type="text" maxlength="14"
            autocomplete="off" enterkeyhint="done" placeholder="별명 (없어도 됨)" />
        </div>
        <div class="ff-row">
          <label class="ff-k" for="inAge">나이대</label>
          <input class="ff-v" id="inAge" type="text" maxlength="14"
            autocomplete="off" enterkeyhint="done" placeholder="20대 추정" />
        </div>
        <div class="ff-row">
          <label class="ff-k" for="inFeat">특 징</label>
          <input class="ff-v" id="inFeat" type="text" maxlength="40"
            autocomplete="off" enterkeyhint="done" placeholder="고른 파츠로 자동" />
        </div>
        <div class="ff-row">
          <span class="ff-k">인상착의</span>
          <span class="ff-v fixed" id="fWear">-</span>
        </div>
      </div>
    </div>

    <div class="picker">
      <div class="tabs" id="catTabs"></div>
      <div class="grid" id="optGrid"></div>
      <div class="swatches" id="swatchRow" hidden></div>
      <div class="p-btns">
        <button class="btn soft" type="button" id="rndBtn">랜덤</button>
        <button class="btn soft" type="button" id="undoBtn">되돌리기</button>
        <button class="btn soft" type="button" id="resetBtn">초기화</button>
        <button class="btn big" type="button" id="doneBtn">완성</button>
      </div>
    </div>
  </section>

  <!-- ===== 완성 ===== -->
  <section class="screen" id="doneScreen">
    <div class="flyer done">
      <div class="f-head"><h1>사람을 찾습니다</h1></div>
      <span class="f-no" id="rNo">제 0000 호</span>
      <div class="f-photo big"><div class="f-art" id="resArt"></div></div>
      <dl class="f-info">
        <div><dt>이 름</dt><dd id="rName">미상</dd></div>
        <div><dt>나이대</dt><dd id="rAge">-</dd></div>
        <div><dt>특 징</dt><dd id="rFeat">-</dd></div>
        <div><dt>인상착의</dt><dd id="rWear">-</dd></div>
        <div><dt>목격장소</dt><dd id="rSeen">-</dd></div>
      </dl>
      <p class="f-call">이 사람, 누구를 만든 걸까요?</p>
      <div class="f-btns row">
        <button class="btn big" type="button" id="saveBtn">전단지 저장</button>
        <button class="btn ghost" type="button" id="shareBtn">친구에게 공유</button>
      </div>
      <div class="f-btns row">
        <button class="btn soft" type="button" id="editBtn">더 다듬기</button>
        <button class="btn soft" type="button" id="newBtn">새로 만들기</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="save-modal" id="saveModal">
    <div class="sm-inner">
      <p class="sm-title">이미지를 꾹 눌러 저장하세요</p>
      <p class="sm-sub">아이폰은 아래 그림을 길게 눌러<br>'사진에 저장'을 고르세요</p>
      <img id="saveImg" alt="몽타주 전단지" />
      <button class="btn soft" type="button" id="saveClose">닫기</button>
    </div>
  </div>
  <div class="sig">ccojik</div>
</div>

<script src="parts.js"></script>
<script src="app.js"></script>
</body>
</html>
