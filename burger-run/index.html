<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>꼬직 · 햄버거 배달 챌린지</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="꼬직 · 햄버거 배달 챌린지" />
<meta property="og:description" content="햄버거를 지키면서 최대한 멀리 배달하세요!" />
<!-- 웹폰트: 숫자가 커서 획이 뭉치지 않는 쪽으로 (peel-egg 와 같은 폰트) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ===== 상단: 거리 / 햄버거 층수 ===== -->
  <div class="top" id="top">
    <!-- 라벨보다 숫자가 먼저 읽히게 — 작은 라벨 아래 큰 숫자 -->
    <div class="gauge">
      <span class="g-cap">거리</span>
      <span class="g-val"><b class="g-num" id="distNum">0</b><span class="g-unit">m</span></span>
    </div>
    <div class="mid">
      <span class="s-num" id="scoreNum">0</span>
      <span class="mission" id="missionBox" hidden>
        <b id="missionText">-</b>
      </span>
    </div>
    <div class="gauge right" id="stackBox">
      <span class="g-cap">햄버거</span>
      <span class="g-val"><b class="g-num" id="stackNum">14</b><span class="g-unit">단</span></span>
    </div>
  </div>

  <!-- ===== 게임판 ===== -->
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <!-- 타이틀 -->
    <div class="over" id="startOver">
      <h1 class="title">햄버거<br>배달 챌린지</h1>
      <canvas class="hero" id="heroCv" width="300" height="560"></canvas>
      <p class="lead">햄버거를 지키면서<br>최대한 멀리 배달하세요!</p>
      <p class="best">BEST <span id="bestStart">0m</span></p>
      <button class="btn big" type="button" id="startBtn">배달 시작</button>
    </div>

    <!-- 결과 화면 -->
    <div class="over over-end" id="endOver" hidden>
      <p class="res-cap" id="resTitle">배달 종료!</p>
      <p class="new-rec" id="newRec" hidden>NEW RECORD!</p>
      <div class="result-egg" id="resultArt"></div>
      <p class="score-big" id="finalDist">0</p>
      <p class="grade" id="gradeLabel">동네 배달원</p>
      <p class="remark" id="remark"></p>
      <dl class="stats">
        <div class="score-row"><dt>SCORE</dt><dd id="finalScore">0</dd></div>
        <div><dt>최대 햄버거</dt><dd id="maxStack">0단</dd></div>
        <div><dt>PERFECT</dt><dd id="perfCount">0회</dd></div>
        <div><dt>MAX COMBO</dt><dd id="comboCount">0</dd></div>
      </dl>
      <div class="res-btns">
        <button class="btn big" type="button" id="againBtn">다시 배달</button>
        <button class="btn ghost" type="button" id="shareBtn">결과 공유</button>
      </div>
      <p class="best">BEST <span id="bestEnd">0m</span></p>
    </div>
  </div>

  <div class="sig">ccojik</div>
</div>

<script src="app.js"></script>
<script>window.SITE_ANALYTICS_PROJECT='ccojik-burger-run';</script>
<script src="../analytics.js"></script>
</body>
</html>
