<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>꼬직 · 10초 케이크 데코</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="꼬직 · 10초 케이크 데코" />
<meta property="og:description" content="까다로운 주문대로 12초 안에 케이크 데코하고 손님한테 평가받기" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">
  <!-- 반짝이 장식 -->
  <span class="spark" style="top:8%;left:6%"></span>
  <span class="spark s2" style="top:16%;right:9%"></span>
  <span class="spark s3" style="bottom:12%;left:12%"></span>
  <span class="spark" style="bottom:18%;right:7%"></span>
  <span class="heart-deco" style="top:24%;right:4%"></span>
  <span class="heart-deco" style="bottom:8%;left:44%"></span>

  <!-- ===== (1) 시작 ===== -->
  <section class="screen start active" id="startScreen">
    <h1 class="game-title">
      <span class="c1">1</span><span class="c2">0</span><span class="c3">초</span>
      <span class="sp"> </span>
      <span class="c4">케</span><span class="c5">이</span><span class="c6">크</span>
      <span class="sp"> </span>
      <span class="c7">데</span><span class="c1">코</span>
    </h1>

    <div class="start-main">
      <div class="order-sheet">
        <div class="sheet-pin"></div>
        <div class="sheet-title">손님 주문서</div>
        <div class="sheet-cust" id="orderCustomer">깐깐한 단골</div>
        <div class="sheet-base">주문 케이크: <span id="orderBaseName">초코시트</span></div>
        <div class="sheet-div"></div>
        <ol class="sheet-list" id="orderList"><!-- JS --></ol>
        <div class="sheet-foot">위 조건대로 12초 안에!</div>
      </div>
      <div class="start-right">
        <div class="start-cake panel"><canvas id="startCake"></canvas></div>
        <canvas id="mascot" width="120" height="120" class="mascot"></canvas>
        <button class="btn pink big" id="startBtn">시작</button>
      </div>
    </div>
  </section>

  <!-- ===== (2) 데코 ===== -->
  <section class="screen deco" id="decoScreen">
    <div class="deco-top">
      <div class="timer" id="timer">
        <span class="timer-num" id="timerNum">12</span>
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      </div>
      <div class="deco-order panel" id="decoOrder">주문</div>
    </div>

    <div class="deco-main">
      <aside class="tool-panel panel">
        <div class="cur-tool" id="curTool"></div>
        <div class="tab-body" id="tabBody"></div>
      </aside>

      <div class="cake-col">
        <div class="cake-wrap panel" id="cakeWrap"><canvas id="cakeCanvas"></canvas></div>
        <div class="deco-controls"><button class="btn red big" id="finishBtn">완성 ㄱㄱ</button></div>
      </div>
    </div>
  </section>

  <!-- ===== (3) 시식 + 평가 ===== -->
  <section class="screen result" id="resultScreen">
    <div class="result-main">
      <div class="verdict-col panel">
        <div class="speech-bubble" id="bubble"><span id="bubbleText"></span></div>
        <canvas id="custFace" width="150" height="150"></canvas>
        <div class="verdict-reveal" id="verdictReveal">
          <div class="stars">
            <div class="stars-row base"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="stars-clip" id="starsFill"><div class="stars-row fill"><i></i><i></i><i></i><i></i><i></i></div></div>
          </div>
          <div class="rating-num"><span id="ratingNum">0.0</span> / 5.0</div>
          <div class="scorecard" id="scoreCard"></div>
          <p class="result-comment" id="resultComment"></p>
          <div class="result-btns">
            <button class="btn green" id="againBtn">다시 하기</button>
            <button class="btn yellow" id="saveBtn">케이크 저장</button>
          </div>
        </div>
      </div>

      <div class="cake-show panel">
        <div class="cake-show-cap" id="cakeShowCap">손님이 시식 중...</div>
        <canvas id="resultCake"></canvas>
        <div class="stamp" id="stamp"><span id="stampText"></span></div>
      </div>
    </div>
  </section>

  <!-- 연출 효과 레이어 -->
  <canvas id="fxCanvas" class="fx-canvas"></canvas>
  <div class="gag review-popup" id="reviewPopup">
    <div class="rp-head">새 리뷰 등록</div>
    <div class="rp-stars"><span class="rp-star on"></span><span class="rp-star"></span><span class="rp-star"></span><span class="rp-star"></span><span class="rp-star"></span></div>
    <div class="rp-text">별점 1.0점 등록됨</div>
  </div>
  <div class="gag sub-gag" id="subGag">단골 손님이 떠났습니다</div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
